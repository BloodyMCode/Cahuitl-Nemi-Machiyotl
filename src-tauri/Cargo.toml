[package]
name = "machiyotl"
version = "1.0.0"
description = "Machiyotl - Calendarios Precoloniales y Animación Toroidal 3D"
authors = ["Ramiro"]
edition = "2021"

[lib]
name = "machiyotl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
